<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Éclairage Va-et-Vient (XOR)</title>
  <style>
    :root {
      --bg-color: #12141d;
      --card-bg: #1c2030;
      --switch-off: #374151;
      --switch-on: #3b82f6;
      --bulb-off: #4b5563;
      --bulb-on: #fde047;
      --glow-color: rgba(253, 224, 71, 0.45);
      --wire-off: #475569;
      --wire-on: #f59e0b;
      --text-color: #e2e8f0;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Boîte principale */
    .circuit-box {
      background: var(--card-bg);
      border: 1px solid #2d3748;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 35px;
      text-align: center;
    }

    /* Inputs cachés (la logique repose dessus) */
    input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* Section Ampoule */
    .bulb-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
    }

    /* Douille */
    .socket {
      width: 32px;
      height: 18px;
      background: linear-gradient(to right, #64748b, #94a3b8, #64748b);
      border-radius: 4px 4px 0 0;
      position: relative;
      z-index: 2;
    }

    /* Ampoule */
    .bulb {
      width: 76px;
      height: 94px;
      background-color: var(--bulb-off);
      border-radius: 50% 50% 40% 40% / 60% 60% 35% 35%;
      margin-top: -6px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Filament */
    .filament {
      width: 24px;
      height: 28px;
      border: 2px solid #6b7280;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      transition: all 0.3s ease;
    }

    /* Badge d'état de l'ampoule */
    .bulb-status {
      margin-top: 15px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      background: #283046;
      color: #94a3b8;
      transition: all 0.3s ease;
    }

    /* Conteneur des Interrupteurs */
    .switches-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 30px;
      gap: 20px;
    }

    .switch-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .switch-label-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* Bouton bascule (Toggle) */
    .toggle-switch {
      position: relative;
      width: 74px;
      height: 38px;
      background-color: var(--switch-off);
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 30px;
      height: 30px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Animation du toggle quand actif */
    .circuit-box:has(#switchA:checked) .label-a .toggle-switch,
    .circuit-box:has(#switchB:checked) .label-b .toggle-switch {
      background-color: var(--switch-on);
    }

    .circuit-box:has(#switchA:checked) .label-a .toggle-slider,
    .circuit-box:has(#switchB:checked) .label-b .toggle-slider {
      transform: translateX(36px);
    }

    /* ------------------------------------------------------------- */
    /* LOGIQUE XOR DU VA-ET-VIENT :                                  */
    /* (A actif ET B inactif) OU (B actif ET A inactif) => AMPOULE ON */
    /* ------------------------------------------------------------- */

    /* Condition 1 : A est coché ET B n'est PAS coché */
    .circuit-box:has(#switchA:checked):not(:has(#switchB:checked)) .bulb,
    /* Condition 2 : B est coché ET A n'est PAS coché */
    .circuit-box:has(#switchB:checked):not(:has(#switchA:checked)) .bulb {
      background-color: var(--bulb-on);
      box-shadow: 
        0 0 30px 10px var(--glow-color),
        0 0 70px 25px rgba(253, 224, 71, 0.25),
        inset 0 -5px 15px rgba(255, 255, 255, 0.8);
      border-color: #fff;
    }

    .circuit-box:has(#switchA:checked):not(:has(#switchB:checked)) .filament,
    .circuit-box:has(#switchB:checked):not(:has(#switchA:checked)) .filament {
      border-color: #ea580c;
      box-shadow: 0 0 10px #ea580c;
    }

    .circuit-box:has(#switchA:checked):not(:has(#switchB:checked)) .bulb-status::after,
    .circuit-box:has(#switchB:checked):not(:has(#switchA:checked)) .bulb-status::after {
      content: "Allumée";
      color: #10b981;
    }

    /* État éteint par défaut (A=0,B=0 ou A=1,B=1) */
    .bulb-status::after {
      content: "Éteinte";
      color: #ef4444;
    }

    /* Tableau de vérité explicatif */
    .truth-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.82rem;
      text-align: center;
      background: #151824;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #232a3b;
    }

    .truth-table th, .truth-table td {
      padding: 8px 12px;
      border: 1px solid #232a3b;
    }

    .truth-table th {
      background: #1e2436;
      color: var(--accent);
      font-weight: 600;
    }

    /* Mise en surbrillance de la ligne active dans le tableau */
    .circuit-box:not(:has(#switchA:checked)):not(:has(#switchB:checked)) .row-00,
    .circuit-box:has(#switchA:checked):not(:has(#switchB:checked)) .row-10,
    .circuit-box:not(:has(#switchA:checked)):has(#switchB:checked)) .row-01,
    .circuit-box:has(#switchA:checked):has(#switchB:checked) .row-11 {
      background-color: rgba(56, 189, 248, 0.15);
      font-weight: bold;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="circuit-box">
    <!-- Inputs gérant l'état logique -->
    <input type="checkbox" id="switchA">
    <input type="checkbox" id="switchB">

    <h1>Simulation Éclairage Va-et-Vient</h1>
    <p class="subtitle">Logique booléenne exclusive (XOR) appliquée à un circuit à 2 interrupteurs</p>

    <!-- Ampoule L -->
    <div class="bulb-section">
      <div class="socket"></div>
      <div class="bulb">
        <div class="filament"></div>
      </div>
      <div class="bulb-status">Ampoule L : </div>
    </div>

    <!-- Interrupteurs A et B -->
    <div class="switches-container">
      <div class="switch-card">
        <label for="switchA" class="label-a toggle-switch">
          <div class="toggle-slider"></div>
        </label>
        <span class="switch-label-text">Switch A</span>
      </div>

      <div class="switch-card">
        <label for="switchB" class="label-b toggle-switch">
          <div class="toggle-slider"></div>
        </label>
        <span class="switch-label-text">Switch B</span>
      </div>
    </div>

    <!-- Table de vérité dynamique -->
    <table class="truth-table">
      <thead>
        <tr>
          <th>Switch A</th>
          <th>Switch B</th>
          <th>Ampoule L</th>
        </tr>
      </thead>
      <tbody>
        <tr class="row-00">
          <td>0 (OFF)</td>
          <td>0 (OFF)</td>
          <td>0 (Éteinte)</td>
        </tr>
        <tr class="row-10">
          <td>1 (ON)</td>
          <td>0 (OFF)</td>
          <td>1 (Allumée)</td>
        </tr>
        <tr class="row-01">
          <td>0 (OFF)</td>
          <td>1 (ON)</td>
          <td>1 (Allumée)</td>
        </tr>
        <tr class="row-11">
          <td>1 (ON)</td>
          <td>1 (ON)</td>
          <td>0 (Éteinte)</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
